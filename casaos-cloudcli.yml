name: cloudcli
services:
  cloudcli:
    cpu_shares: 90
    command: []
    container_name: cloudcli
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - TZ=Asia/Dhaka
    hostname: cloudcli
    image: asiqurrahman/cloudcli:production
    labels:
      icon: https://raw.githubusercontent.com/asiqur-rahman/claudecodeui-contrib/production/public/logo.svg
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/cloudcli/data
        target: /data
        bind:
          create_host_path: true
    ports:
      - target: 3001
        published: "50081"
        protocol: tcp
    devices: []
    cap_add: []
    networks:
      - cloudcli-network
    privileged: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
      volumes:
        - container: /data
          description:
            en_US: Settings, database, chat history, assets, and provider data
      ports:
        - container: "3001"
          description:
            en_US: Web UI, API, and WebSocket entry point
      networks:
        - container: cloudcli-network
          description:
            en_US: Isolated CloudCLI bridge network

networks:
  cloudcli-network:
    name: cloudcli-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  author: Md. Asiqur Rahman Khan
  category: Developer Tools
  description:
    en_US: Web dashboard for coding-agent CLIs (Claude Code, Codex, Cursor,
      OpenCode, Command Code). Chat with your coding agents, browse files, use
      git, run a terminal, and configure MCP servers — all from any browser or
      mobile device.
  developer: asiqur-rahman
  hostname: ""
  icon: https://raw.githubusercontent.com/asiqur-rahman/claudecodeui-contrib/production/public/logo.svg
  id: com.asiqurrahman.cloudcli
  index: /
  is_uncontrolled: false
  main: cloudcli
  port_map: "50081"
  scheme: http
  store_app_id: cloudcli
  tagline:
    en_US: Web UI for Claude Code & coding agents
  thumbnail: ""
  title:
    custom: ""
    en_US: CloudCLI
  networks:
    - container: cloudcli-network
      description:
        en_US: Isolated bridge network for the CloudCLI container
  tips:
    before_install:
      en_US: This is a personal fork's build (asiqurrahman/cloudcli), not the
        official siteboon/claudecodeui image. Configure authentication and
        provider credentials from the web UI after first launch; no
        credentials are baked into the image. The :production tag always
        points at the latest build published by the fork's pipeline — pull
        again and recreate the container to update, no manifest edit needed.
        Pin a specific tag instead if you want to roll back to a known-good
        build. Back up the mounted /data directory — it holds the database,
        settings, chat history, assets, and per-provider state.

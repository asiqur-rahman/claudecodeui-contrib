name: cloudcli
services:
  cloudcli:
    container_name: cloudcli
    hostname: cloudcli
    image: asiqurrahman/cloudcli-ui:production
    restart: unless-stopped
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - TZ=Asia/Dhaka
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
    ports:
      - target: 3001
        published: "50081"
        protocol: tcp
    volumes:
      # All CloudCLI + provider state lives under /DATA/AppData/cloudcli so
      # CasaOS preserves everything (database, settings, chat history,
      # assets, and per-provider .claude/.codex/.commandcode/.cursor state)
      # across container recreations. The app's HOME is /data, so the
      # bundled CLIs create their dotdirs here automatically.
      - type: bind
        source: /DATA/AppData/cloudcli
        target: /data
        bind:
          create_host_path: true
    networks:
      - cloudcli-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
        - container: ANTHROPIC_API_KEY
          description:
            en_US: Optional. Authenticates Claude Code and Command Code against Anthropic without an interactive login. Leave empty to log in with /login inside the container instead.
        - container: OPENAI_API_KEY
          description:
            en_US: Optional. Authenticates OpenAI Codex without an interactive login. Leave empty to log in with codex /login inside the container instead.
        - container: ANTHROPIC_AUTH_TOKEN
          description:
            en_US: Optional. Long-lived Anthropic OAuth token (preferred over an API key for Claude Code).
      volumes:
        - container: /data
          description:
            en_US: Settings, database, chat history, assets, and provider data
      ports:
        - container: "3001"
          description:
            en_US: Web UI, API, and WebSocket entry point
      networks:
        - container: cloudcli-network
          description:
            en_US: Isolated CloudCLI bridge network

networks:
  cloudcli-network:
    name: cloudcli-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  author: Md. Asiqur Rahman Khan
  category: Developer Tools
  description:
    en_US: Web dashboard for coding-agent CLIs (Claude Code, Codex, Cursor,
      OpenCode, Command Code). Chat with your coding agents, browse files, use
      git, run a terminal, and configure MCP servers — all from any browser or
      mobile device.
  developer: asiqur-rahman
  icon: https://raw.githubusercontent.com/asiqur-rahman/claudecodeui-contrib/production/public/logo.svg
  id: com.asiqurrahman.cloudcli
  index: /
  is_uncontrolled: false
  main: cloudcli
  port_map: "50081"
  scheme: http
  store_app_id: cloudcli
  tagline:
    en_US: Web UI for Claude Code & coding agents
  title:
    en_US: CloudCLI
  tips:
    before_install:
      en_US: >-
        This is a personal fork build (asiqurrahman/cloudcli-ui), not the
        official siteboon/claudecodeui image. The image bundles the Claude
        Code, OpenAI Codex and Command Code CLIs. All state is preserved by
        CasaOS under /DATA/AppData/cloudcli — the database, settings, chat
        history, assets, and each provider's login state
        (.claude/.codex/.commandcode/.cursor) survive container updates and
        recreations. Provider auth options are (1) set ANTHROPIC_API_KEY or
        OPENAI_API_KEY in the env fields below for instant Claude and Codex
        auth, or (2) leave them empty and run one-time interactive logins
        inside the container, for example 'docker exec -it cloudcli claude
        /login', 'docker exec -it cloudcli codex /login', and
        'docker exec -it cloudcli command-code /login'. Cursor and OpenCode
        are not bundled. The production tag always points at the latest
        build published by the fork's pipeline — pull again and recreate the
        container to update. Back up /DATA/AppData/cloudcli to keep all
        settings, logins and history.

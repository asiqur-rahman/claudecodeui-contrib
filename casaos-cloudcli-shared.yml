name: cloudcli-shared
services:
  cloudcli:
    container_name: cloudcli-shared
    hostname: cloudcli
    image: asiqurrahman/cloudcli-ui:production
    # Run as uid 1000 (the typical first host user) so the files under
    # /DATA/AppData/cloudcli can also be used by host CLIs that run as that
    # user. If your host user is a different uid, adjust this line.
    user: "1000:1000"
    restart: unless-stopped
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - TZ=Asia/Dhaka
      # Optional API keys: leave empty to log in interactively instead.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
    ports:
      - target: 3001
        published: "50082"
        protocol: tcp
    volumes:
      # All state (app + every provider) lives under /DATA/AppData/cloudcli
      # so CasaOS preserves it across container recreations. Each provider
      # dotdir is a first-class folder here, kept visible on the host under
      # /DATA/AppData/cloudcli/.claude, ./.codex, ./.commandcode, ./.cursor.
      #
      # No host-user paths are mounted (e.g. /home/<user>/.claude) because
      # Docker bind sources are literal host paths and cannot auto-detect the
      # logged-in user — CasaOS runs containers as root, so any ${HOME}
      # interpolation would resolve to /root and break. State is therefore
      # username-independent: the bundled CLIs create their dotdirs under
      # /data (HOME=/data) automatically.
      #
      # CasaOS creates /DATA/AppData/cloudcli as root, but this container
      # runs as uid 1000 so the same files can be shared with host CLIs that
      # run as the first (uid-1000) user. Create it once and chown:
      #   sudo mkdir -p /DATA/AppData/cloudcli
      #   sudo chown -R 1000:1000 /DATA/AppData/cloudcli
      - type: bind
        source: /DATA/AppData/cloudcli
        target: /data
        bind:
          create_host_path: true
    networks:
      - cloudcli-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
        - container: ANTHROPIC_API_KEY
          description:
            en_US: Optional. Overrides host login for Claude/Command Code. Leave empty to use the shared host dotdirs.
        - container: OPENAI_API_KEY
          description:
            en_US: Optional. Overrides host login for Codex. Leave empty to use the shared host dotdirs.
        - container: ANTHROPIC_AUTH_TOKEN
          description:
            en_US: Optional. Long-lived Anthropic OAuth token.
      volumes:
        - container: /data
          description:
            en_US: All CloudCLI + provider state under /DATA/AppData/cloudcli (preserved by CasaOS).
      ports:
        - container: "3001"
          description:
            en_US: Web UI, API, and WebSocket entry point
      networks:
        - container: cloudcli-network
          description:
            en_US: Isolated CloudCLI bridge network

networks:
  cloudcli-network:
    name: cloudcli-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  author: Md. Asiqur Rahman Khan
  category: Developer Tools
  description:
    en_US: Web dashboard for coding-agent CLIs. All state is preserved by
      CasaOS under /DATA/AppData/cloudcli (app + provider dotdirs together),
      running as uid 1000 so host CLIs can use the same files.
  developer: asiqur-rahman
  icon: https://raw.githubusercontent.com/asiqur-rahman/claudecodeui-contrib/production/public/logo.svg
  id: com.asiqurrahman.cloudcli-shared
  index: /
  is_uncontrolled: false
  main: cloudcli
  port_map: "50082"
  scheme: http
  store_app_id: cloudcli-shared
  tagline:
    en_US: CloudCLI UI (uid 1000 state under /DATA/AppData/cloudcli)
  title:
    en_US: CloudCLI (Shared)
  tips:
    before_install:
      en_US: >-
        All CloudCLI and provider state is preserved by CasaOS under
        /DATA/AppData/cloudcli — the database, settings, chat history,
        assets, and each provider's login state (.claude/.codex/
        .commandcode/.cursor) survive container updates and recreations as
        one folder. No host-user paths are hardcoded: bind mounts are
        literal host paths and cannot auto-detect the logged-in user, so all
        state stays username-independent under /DATA/AppData/cloudcli. The
        container runs as uid 1000 so files can also be used by host CLIs
        running as the same uid; create the folder once on first install
        with 'sudo mkdir -p /DATA/AppData/cloudcli && sudo chown -R
        1000:1000 /DATA/AppData/cloudcli'. Log in per provider with the
        API-key env fields or one-time 'docker exec -it cloudcli-shared
        <cli> /login'. Cursor additionally needs 'docker exec -it
        cloudcli-shared agent login' (its auth is machine-bound). OpenCode
        is not bundled. This variant and casaos-cloudcli.yml share the same
        /DATA/AppData/cloudcli state — run one or the other, not both.

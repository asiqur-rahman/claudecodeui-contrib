name: cloudcli-shared
services:
  cloudcli:
    container_name: cloudcli-shared
    hostname: cloudcli
    image: asiqurrahman/cloudcli-ui:production
    # Run as the host user (uid/gid 1000 = 'asiq' on the VPS) so the
    # container's claude/codex/command-code write to the shared host
    # dotdirs with the same ownership as the host CLIs. Adjust to your
    # host uid if 'asiq' is not 1000 (check: id -u asiq).
    user: "1000:1000"
    restart: unless-stopped
    cpu_shares: 90
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - TZ=Asia/Dhaka
      # Optional API keys: leave empty to use the shared host logins.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      # Prepend the mounted host bin dir so the container can run the host's
      # Cursor `agent` binary (mounted at /host-bin below).
      - PATH=/host-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - target: 3001
        published: "50082"
        protocol: tcp
    volumes:
      # All state (app + every provider) lives under /DATA/AppData/cloudcli
      # so CasaOS preserves it across container recreations. Each provider
      # dotdir is a first-class folder here, kept visible on the host under
      # /DATA/AppData/cloudcli/.claude, ./.codex, ./.commandcode, ./.cursor.
      #
      # CasaOS creates /DATA/AppData/cloudcli as root, but this container
      # runs as uid 1000 to match host CLIs, so create it once and chown:
      #   sudo mkdir -p /DATA/AppData/cloudcli
      #   sudo chown -R 1000:1000 /DATA/AppData/cloudcli
      - type: bind
        source: /DATA/AppData/cloudcli
        target: /data
        bind:
          create_host_path: true
      # Provider dotdirs live under /data (HOME=/data), so the app's bundled
      # CLIs create and read them at /data/.claude etc. — no separate host
      # mounts needed. The following bind mounts are OPTIONAL and only for
      # reusing logins a HOST CLI already created elsewhere (e.g. in
      # /home/asiq): delete any you do not want. To point the host's own
      # claude/codex/command-code at the CasaOS-managed state instead, set
      # each CLI's HOME/config dir to /DATA/AppData/cloudcli on the host.
      - type: bind
        source: /home/asiq/.claude
        target: /data/.claude
        bind:
          create_host_path: true
      - type: bind
        source: /home/asiq/.claude.json
        target: /data/.claude.json
        bind:
          create_host_path: true
      - type: bind
        source: /home/asiq/.commandcode
        target: /data/.commandcode
        bind:
          create_host_path: true
      - type: bind
        source: /home/asiq/.codex
        target: /data/.codex
        bind:
          create_host_path: true
      - type: bind
        source: /home/asiq/.cursor
        target: /data/.cursor
        bind:
          create_host_path: true
      # Cursor CLI: if the host runs Cursor's agent CLI (`agent`, installed
      # via 'curl https://cursor.com/install -fsS | bash'), mount its bin +
      # version dirs so the container reuses the same binary. Delete if you
      # do not use Cursor or prefer the bundled resolution.
      - type: bind
        source: /home/asiq/.local/bin
        target: /host-bin
        bind:
          create_host_path: true
      - type: bind
        source: /home/asiq/.local/share
        target: /home/asiq/.local/share
        bind:
          create_host_path: true
    networks:
      - cloudcli-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    x-casaos:
      envs:
        - container: TZ
          description:
            en_US: Timezone
        - container: ANTHROPIC_API_KEY
          description:
            en_US: Optional. Overrides host login for Claude/Command Code. Leave empty to use the shared host dotdirs.
        - container: OPENAI_API_KEY
          description:
            en_US: Optional. Overrides host login for Codex. Leave empty to use the shared host dotdirs.
        - container: ANTHROPIC_AUTH_TOKEN
          description:
            en_US: Optional. Long-lived Anthropic OAuth token.
      volumes:
        - container: /data
          description:
            en_US: All CloudCLI + provider state under /DATA/AppData/cloudcli (preserved by CasaOS).
        - container: /data/.claude
          description:
            en_US: Optional host ~/.claude share (delete the mount if unused)
        - container: /data/.commandcode
          description:
            en_US: Optional host ~/.commandcode share (delete the mount if unused)
        - container: /data/.codex
          description:
            en_US: Optional host ~/.codex share (delete the mount if unused)
        - container: /data/.cursor
          description:
            en_US: Optional host ~/.cursor share (delete the mount if unused)
      ports:
        - container: "3001"
          description:
            en_US: Web UI, API, and WebSocket entry point
      networks:
        - container: cloudcli-network
          description:
            en_US: Isolated CloudCLI bridge network

networks:
  cloudcli-network:
    name: cloudcli-network
    driver: bridge

x-casaos:
  architectures:
    - amd64
  author: Md. Asiqur Rahman Khan
  category: Developer Tools
  description:
    en_US: Web dashboard for coding-agent CLIs. All state is preserved by
      CasaOS under /DATA/AppData/cloudcli (app + provider dotdirs together).
      Runs as uid 1000 and can additionally reuse the host machine's
      existing claude / codex / command-code / cursor logins via optional
      bind mounts.
  developer: asiqur-rahman
  icon: https://raw.githubusercontent.com/asiqur-rahman/claudecodeui-contrib/production/public/logo.svg
  id: com.asiqurrahman.cloudcli-shared
  index: /
  is_uncontrolled: false
  main: cloudcli
  port_map: "50082"
  scheme: http
  store_app_id: cloudcli-shared
  tagline:
    en_US: CloudCLI UI (uid 1000, optional host-login reuse)
  title:
    en_US: CloudCLI (Shared)
  tips:
    before_install:
      en_US: >-
        All CloudCLI and provider state is preserved by CasaOS under
        /DATA/AppData/cloudcli — the database, settings, chat history,
        assets, and each provider's login state (.claude/.codex/
        .commandcode/.cursor) survive container updates and recreations as
        one folder. This container runs as uid 1000 so files match host
        CLIs; create the folder once on first install with
        'sudo mkdir -p /DATA/AppData/cloudcli && sudo chown -R 1000:1000
        /DATA/AppData/cloudcli'. Per provider: Command Code and Claude Code
        authenticate as soon as their login exists under
        /DATA/AppData/cloudcli (created by the in-container /login flows or
        API-key env fields). The optional /home/asiq bind mounts below only
        matter when you want to reuse logins a HOST CLI created elsewhere —
        delete any you do not want. Cursor: run 'docker exec -it
        cloudcli-shared agent login' once inside the container and open the
        printed browser URL (its auth is machine-bound). OpenCode is not
        bundled. This variant and casaos-cloudcli.yml share the same
        /DATA/AppData/cloudcli state — run one or the other, not both.
        Delete this app and re-import casaos-cloudcli.yml to return to the
        plain setup.
